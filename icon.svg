<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#5e5ce6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="280" rx="115" ry="115" fill="url(#shine)"/>

  <g filter="url(#shadow)" transform="translate(256, 256)">
    <rect x="-130" y="-90" width="260" height="180" rx="20" ry="20"
          fill="#ffffff" fill-opacity="0.98"/>
    <path d="M -130 -70 L 0 30 L 130 -70"
          fill="none" stroke="#0a84ff" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -130 90 L -40 20"
          fill="none" stroke="#0a84ff" stroke-width="12"
          stroke-linecap="round" opacity="0.5"/>
    <path d="M 130 90 L 40 20"
          fill="none" stroke="#0a84ff" stroke-width="12"
          stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
